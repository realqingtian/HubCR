name: hubcr-integration

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hubcr_test
      POSTGRES_USER: hubcr_test
      POSTGRES_PASSWORD: hubcr-test-only
    ports:
      - "127.0.0.1:${HUBCR_TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1s
      timeout: 3s
      retries: 20
