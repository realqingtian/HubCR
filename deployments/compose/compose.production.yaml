services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports: !reset []
    restart: unless-stopped

  minio-init:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}

  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: ${HUBCR_API_IMAGE:-hubcr-api:local}
    command: ["/usr/local/bin/hubcr-migrate"]
    environment:
      HUBCR_DATABASE_URL: ${HUBCR_DATABASE_URL:?set HUBCR_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["operations"]

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: ${HUBCR_API_IMAGE:-hubcr-api:local}
    command: ["/usr/local/bin/hubcr-api"]
    environment:
      HUBCR_API_ADDRESS: 0.0.0.0:8080
      HUBCR_DATABASE_URL: ${HUBCR_DATABASE_URL:?set HUBCR_DATABASE_URL}
      HUBCR_SESSION_COOKIE_SECURE: ${HUBCR_SESSION_COOKIE_SECURE:-true}
      HUBCR_REGISTRY_AUTH_ENABLED: "true"
      HUBCR_REGISTRY_EXTERNAL_URL: ${HUBCR_REGISTRY_EXTERNAL_URL:?set HUBCR_REGISTRY_EXTERNAL_URL}
      HUBCR_REGISTRY_ALLOW_INSECURE_HTTP: ${HUBCR_REGISTRY_ALLOW_INSECURE_HTTP:-false}
      HUBCR_REGISTRY_SERVICE: ${HUBCR_REGISTRY_SERVICE:-hubcr-registry}
      HUBCR_REGISTRY_ISSUER: ${HUBCR_REGISTRY_ISSUER:-hubcr-token-service}
      HUBCR_REGISTRY_TOKEN_TTL: ${HUBCR_REGISTRY_TOKEN_TTL:-5m}
      HUBCR_REGISTRY_TOKEN_PRIVATE_KEY_FILE: /run/hubcr/registry-auth/private.pem
      HUBCR_REGISTRY_TOKEN_JWKS_FILE: /run/hubcr/registry-auth/jwks.json
      HUBCR_REGISTRY_EVENT_TOKEN: ${HUBCR_REGISTRY_EVENT_TOKEN:?set HUBCR_REGISTRY_EVENT_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - ${HUBCR_REGISTRY_AUTH_DIR:?set HUBCR_REGISTRY_AUTH_DIR}:/run/hubcr/registry-auth:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: ${HUBCR_API_IMAGE:-hubcr-api:local}
    command: ["/usr/local/bin/hubcr-worker"]
    environment:
      HUBCR_DATABASE_URL: ${HUBCR_DATABASE_URL:?set HUBCR_DATABASE_URL}
      HUBCR_WORKER_POLL_INTERVAL: ${HUBCR_WORKER_POLL_INTERVAL:-5s}
      HUBCR_WORKER_LEASE_DURATION: ${HUBCR_WORKER_LEASE_DURATION:-15m}
      HUBCR_WORKER_JOB_TIMEOUT: ${HUBCR_WORKER_JOB_TIMEOUT:-10m}
      HUBCR_WORKER_SHUTDOWN_TIMEOUT: ${HUBCR_WORKER_SHUTDOWN_TIMEOUT:-20s}
      HUBCR_WORKER_RETRY_BASE: ${HUBCR_WORKER_RETRY_BASE:-5s}
      HUBCR_WORKER_RETRY_MAX: ${HUBCR_WORKER_RETRY_MAX:-5m}
      HUBCR_WORKER_MAX_CONCURRENCY: ${HUBCR_WORKER_MAX_CONCURRENCY:-2}
      HUBCR_SECURITY_SCANNER_ENABLED: ${HUBCR_SECURITY_SCANNER_ENABLED:-true}
      HUBCR_TRIVY_BINARY: /usr/local/bin/trivy
      HUBCR_TRIVY_CACHE_DIR: /var/lib/hubcr/trivy
      HUBCR_COSIGN_BINARY: /usr/local/bin/cosign
      HUBCR_COSIGN_SCRATCH_DIR: /var/lib/hubcr/cosign
      HUBCR_SCANNER_REGISTRY_HOST: registry:5000
      HUBCR_SCANNER_REGISTRY_INSECURE: "true"
      HUBCR_SCANNER_REGISTRY_TOKEN_TTL: ${HUBCR_REGISTRY_TOKEN_TTL:-5m}
      HUBCR_REGISTRY_SERVICE: ${HUBCR_REGISTRY_SERVICE:-hubcr-registry}
      HUBCR_REGISTRY_ISSUER: ${HUBCR_REGISTRY_ISSUER:-hubcr-token-service}
      HUBCR_REGISTRY_TOKEN_PRIVATE_KEY_FILE: /run/hubcr/registry-auth/private.pem
      HUBCR_SECURITY_REPAIR_INTERVAL: ${HUBCR_SECURITY_REPAIR_INTERVAL:-30s}
      HUBCR_SECURITY_REPAIR_BATCH: ${HUBCR_SECURITY_REPAIR_BATCH:-100}
    depends_on:
      postgres:
        condition: service_healthy
      registry:
        condition: service_started
    volumes:
      - ${HUBCR_REGISTRY_AUTH_DIR:?set HUBCR_REGISTRY_AUTH_DIR}:/run/hubcr/registry-auth:ro
      - trivy-cache:/var/lib/hubcr/trivy
    restart: unless-stopped

  web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        HUBCR_CONTROL_PLANE_URL: http://api:8080
    image: ${HUBCR_WEB_IMAGE:-hubcr-web:local}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  registry:
    environment:
      REGISTRY_LOG_LEVEL: warn
      REGISTRY_AUTH_TOKEN_REALM: ${HUBCR_REGISTRY_EXTERNAL_URL:?set HUBCR_REGISTRY_EXTERNAL_URL}/token
      REGISTRY_AUTH_TOKEN_SERVICE: ${HUBCR_REGISTRY_SERVICE:-hubcr-registry}
      REGISTRY_AUTH_TOKEN_ISSUER: ${HUBCR_REGISTRY_ISSUER:-hubcr-token-service}
      REGISTRY_NOTIFICATIONS_ENDPOINTS_0_URL: http://api:8080/internal/registry/events
      REGISTRY_NOTIFICATIONS_ENDPOINTS_0_HEADERS: "Authorization: [Bearer ${HUBCR_REGISTRY_EVENT_TOKEN:?set HUBCR_REGISTRY_EVENT_TOKEN}]"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    ports: !reset []
    restart: unless-stopped

  gateway:
    environment:
      HUBCR_GATEWAY_API_HOST: api
      HUBCR_GATEWAY_API_PORT: 8080
      HUBCR_GATEWAY_WEB_HOST: web
      HUBCR_GATEWAY_WEB_PORT: 3000
    depends_on:
      registry:
        condition: service_started
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports: !override
      - "${HUBCR_GATEWAY_BIND_ADDRESS:-127.0.0.1}:${HUBCR_GATEWAY_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5000/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  trivy-cache:
