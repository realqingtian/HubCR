name: hubcr

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hubcr}
      POSTGRES_USER: ${POSTGRES_USER:-hubcr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hubcr-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hubcr}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hubcr-dev-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        do sleep 1; done;
        mc mb --ignore-existing local/hubcr-registry
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hubcr}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hubcr-dev-only}

  registry:
    image: registry:3
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      REGISTRY_STORAGE_S3_ACCESSKEY: ${MINIO_ROOT_USER:-hubcr}
      REGISTRY_STORAGE_S3_SECRETKEY: ${MINIO_ROOT_PASSWORD:-hubcr-dev-only}
    ports:
      - "5000:5000"
    volumes:
      - ./distribution/config.yml:/etc/distribution/config.yml:ro

volumes:
  postgres-data:
  redis-data:
  minio-data:
