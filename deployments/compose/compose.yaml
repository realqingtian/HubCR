name: hubcr

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hubcr}
      POSTGRES_USER: ${POSTGRES_USER:-hubcr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hubcr-dev-only}
    ports:
      - "127.0.0.1:${HUBCR_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${HUBCR_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hubcr}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hubcr-dev-only}
    ports:
      - "127.0.0.1:${HUBCR_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${HUBCR_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        do sleep 1; done;
        mc mb --ignore-existing local/hubcr-registry
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hubcr}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hubcr-dev-only}

  registry:
    image: registry:3
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      REGISTRY_STORAGE_S3_ACCESSKEY: ${MINIO_ROOT_USER:-hubcr}
      REGISTRY_STORAGE_S3_SECRETKEY: ${MINIO_ROOT_PASSWORD:-hubcr-dev-only}
      REGISTRY_AUTH_TOKEN_REALM: http://localhost:${HUBCR_REGISTRY_PORT:-5000}/token
      REGISTRY_AUTH_TOKEN_SERVICE: ${HUBCR_REGISTRY_SERVICE:-hubcr-registry}
      REGISTRY_AUTH_TOKEN_ISSUER: ${HUBCR_REGISTRY_ISSUER:-hubcr-token-service}
      REGISTRY_AUTH_TOKEN_JWKS: /run/hubcr/registry-auth/jwks.json
      REGISTRY_NOTIFICATIONS_ENDPOINTS_0_URL: http://host.docker.internal:${HUBCR_API_PORT:-8080}/internal/registry/events
      REGISTRY_NOTIFICATIONS_ENDPOINTS_0_HEADERS: "Authorization: [Bearer ${HUBCR_REGISTRY_EVENT_TOKEN:?run make registry-dev-keys first}]"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${HUBCR_REGISTRY_DEBUG_PORT:-5002}:5001"
    expose:
      - "5000"
    volumes:
      - ./distribution/config.yml:/etc/distribution/config.yml:ro
      - ${HUBCR_REGISTRY_AUTH_DIR:-../../.data/registry-auth}:/run/hubcr/registry-auth:ro

  gateway:
    image: nginx:1.29-alpine
    depends_on:
      - registry
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HUBCR_GATEWAY_API_HOST: host.docker.internal
      HUBCR_GATEWAY_API_PORT: ${HUBCR_API_PORT:-8080}
      NGINX_ENVSUBST_FILTER: ^HUBCR_GATEWAY_
    ports:
      - "127.0.0.1:${HUBCR_REGISTRY_PORT:-5000}:5000"
    volumes:
      - ./gateway/default.conf.template:/etc/nginx/templates/hubcr.conf.template:ro

volumes:
  postgres-data:
  redis-data:
  minio-data:
