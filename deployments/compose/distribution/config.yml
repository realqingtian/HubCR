version: 0.1

log:
  level: info
  formatter: json
  fields:
    service: hubcr-registry

storage:
  s3:
    region: us-east-1
    bucket: hubcr-registry
    regionendpoint: http://minio:9000
    forcepathstyle: true
    secure: false
    v4auth: true
    rootdirectory: /registry
  delete:
    enabled: false

auth:
  token:
    realm: http://localhost:5000/token
    service: hubcr-registry
    issuer: hubcr-token-service
    jwks: /run/hubcr/registry-auth/jwks.json

notifications:
  events:
    includereferences: true
  endpoints:
    - name: hubcr-control-plane
      url: http://host.docker.internal:8080/internal/registry/events
      headers:
        Authorization: []
      timeout: 2s
      threshold: 5
      backoff: 1s
      ignore:
        actions: [pull, delete, mount]

http:
  addr: :5000
  debug:
    addr: :5001
    prometheus:
      enabled: true
      path: /metrics
  headers:
    X-Content-Type-Options: [nosniff]

health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
