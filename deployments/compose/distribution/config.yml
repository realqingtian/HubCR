version: 0.1

log:
  level: info
  fields:
    service: hubcr-registry

storage:
  s3:
    region: us-east-1
    bucket: hubcr-registry
    regionendpoint: http://minio:9000
    forcepathstyle: true
    secure: false
    v4auth: true
    rootdirectory: /registry
  delete:
    enabled: false

auth:
  token:
    realm: http://localhost:5000/token
    service: hubcr-registry
    issuer: hubcr-token-service
    jwks: /run/hubcr/registry-auth/jwks.json

http:
  addr: :5000
  headers:
    X-Content-Type-Options: [nosniff]

health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
